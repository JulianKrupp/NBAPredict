# NBA Predict – Docker Compose
# Starten mit: docker compose up
# Stoppen mit:  docker compose down

services:

  # ── Web-Applikation ──────────────────────────────────────────────────────
  web:
    build: .
    container_name: nba-predict-web
    ports:
      - "5000:5000"
    volumes:
      # Persistenz: Datenbank, Modelle und Trainingsdaten bleiben erhalten
      - ./data:/app/data
      - ./logs:/app/logs
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/status')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

